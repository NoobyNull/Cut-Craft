# Cut Craft for Windows (x86-64, .zip), started on the runner to check it runs. It runs when
# the packaging changes on a pushed branch, from the Actions tab, and on a release tag; the
# build is the run's artifact. Unsigned by Microsoft: Windows asks before the first open.
# Each computer is built by its own workflow (builds-linux.yml, builds-windows.yml,
# builds-macos.yml), so one failing or waiting for a runner holds back none of the others.
# On a v* tag (pushed, or started on the tag by Release tag) each signs its own files and adds
# them to the release, and whichever finishes first publishes it (publish-release.yml).
name: Builds (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release this v* tag (built from the tag, with this branch's workflow). Empty: just build this branch."
        required: false
        default: ""
  push:
    tags: ["v*"]
    # not on every push: CI already builds and tests each one
    branches: ["**"]
    paths:
      - ".github/workflows/builds-windows.yml"
      - "scripts/start-check.ps1"
      - ".github/workflows/publish-release.yml"
      - "scripts/publish-release"
      - ".github/workflows/platform-tests.yml"
      - "scripts/sign-release"
      - "packaging/**"
      - "assets/windows/**"

permissions:
  contents: write

# one build per branch or tag at a time (a tag pushed and the same tag started by hand share
# it, so two never publish the same files at once); a tag's build is never cancelled part-way
concurrency:
  group: builds-windows-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ !inputs.tag && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }} # empty: the commit this run is for
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p cut-craft
      # the icon and name build.rs puts in the .exe (Explorer, shortcuts, the taskbar)
      - name: Check the program carries its icon and name
        shell: pwsh
        run: |
          $info = (Get-Item target/release/cut-craft.exe).VersionInfo
          if ($info.FileDescription -ne "Cut Craft" -or $info.ProductName -ne "Cut Craft") {
            throw "cut-craft.exe has no Cut Craft resources: '$($info.FileDescription)'"
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon("target/release/cut-craft.exe")
          "Icon {0}x{1}, version {2}" -f $icon.Width, $icon.Height, $info.FileVersion
      # needs no Visual C++ runtime, and keeps running with its window set up
      - name: Start the program
        shell: pwsh
        run: scripts/start-check.ps1 target/release/cut-craft.exe
      - name: Package the program
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $name = "cut-craft-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/cut-craft.exe, README.md, LICENSE -Destination "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cut-craft-windows
          path: dist/*.zip

  # On a v* tag: this computer's own tests (format, Clippy, every test) on the tagged code.
  # Its files are published only once these pass.
  tests:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/platform-tests.yml
    with:
      os: windows-latest
      ref: ${{ inputs.tag }}

  # On a v* tag: signs these and adds them to the release, publishing it if this computer's
  # builds are the first to finish. The other computers' builds don't wait for these, nor
  # these for them.
  release:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    needs: [tests, windows]
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      artifacts: "cut-craft-windows"
    secrets: inherit
