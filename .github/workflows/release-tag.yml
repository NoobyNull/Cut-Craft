# Tags each version as it lands on main, so no one has to push a tag by hand.
# Each version on main's line since the last tag that has no vX.Y.Z tag yet (a "chore: version
# X.Y.Z" pull request just merged, or a tag was never pushed) is tagged on the commit it arrived
# in (scripts/release-commit untagged), and Builds is started on that tag, which builds, signs and publishes the
# release. A version that already has its tag is left alone: v* tags are never moved or deleted.
#
# The tag is pushed with the workflow's own token. "Protect release tags" lets anyone make a new
# v* tag; it only stops one being moved or deleted, so no key or secret is needed. A tag pushed
# with that token starts no workflows by itself, so Builds is started on it explicitly.
# The nightly Version bump pushes its commit and tag together, so by the time this runs for
# that commit the tag is there and it does nothing.
name: Release tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the tag
  actions: write # start Builds on it

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tag each version that has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          newest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          # oldest first; more than one when versions merged faster than this job ran
          versions=$(scripts/release-commit untagged HEAD)
          if [[ -z $versions ]]; then
            echo "main's version is already tagged: nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while read -r version commit; do
            tag="v$version"
            if [[ -n $newest ]] && [[ $(printf '%s\n' "${newest#v}" "$version" | sort -V | tail -1) != "$version" ]]; then
              echo "::warning::$version arrived on ${commit::7} but $newest is newer; not tagging an older version."
              continue
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag was made meanwhile by another run." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            git tag -a "$tag" "$commit" -m "Cut Craft $version"
            if ! git push origin "refs/tags/$tag"; then
              # another run (or the nightly job) made it a moment ago: fine, it starts its own build
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
                echo "$tag was made meanwhile by another run." >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              echo "::error::Could not push $tag. Check Settings → Rules → Rulesets: \"Protect release tags\" must allow creating v* tags."
              exit 1
            fi
            gh workflow run builds.yml --ref "$tag"
            echo "Tagged $tag on ${commit::7} and started **Builds** on it." >> "$GITHUB_STEP_SUMMARY"
          done <<< "$versions"
          echo "Each release appears on the Releases page when its Builds run finishes." >> "$GITHUB_STEP_SUMMARY"
