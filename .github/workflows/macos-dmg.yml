# Cut Craft for macOS as a DMG (Apple Silicon and Intel in one app), built on GitHub's
# macOS runner by scripts/macos-dmg. Run it from the Actions tab (the DMG is the run's
# artifact), or push a tag such as v0.1.0 to attach it to that release.
# Unsigned: macOS asks before the first open (right-click > Open).
name: macOS DMG

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Tools for the app icon
        run: brew install librsvg
      - name: Build the app and its DMG
        run: scripts/macos-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: cut-craft-macos
          path: dist/*.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Cut Craft $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
