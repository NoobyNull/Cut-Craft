# Cut Craft for macOS (a DMG, Apple Silicon and Intel in one app), Linux (x86-64: .tar.gz,
# AppImage and Flatpak) and Windows (x86-64, .zip), built side by side on GitHub's runners. It runs when the
# packaging changes on a pushed branch and from the Actions tab (once on the default
# branch); each build is the run's artifact. On a v* tag (pushed, or started on the tag by
# Release tag) it signs them all and attaches them to that release; it is the only workflow
# that publishes versioned releases. Unsigned by Apple/Microsoft: macOS and Windows ask before
# the first open.
name: Builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release this v* tag (built from the tag, with this branch's workflow). Empty: just build this branch."
        required: false
        default: ""
  push:
    tags: ["v*"]
    # macOS and Windows runners cost private repositories more minutes: not on every push
    branches: ["**"]
    paths:
      - ".github/workflows/builds.yml"
      - "scripts/macos-dmg"
      - "scripts/linux-packages"
      - "packaging/**"

permissions:
  contents: write

# one build per branch or tag at a time; a tag's build is never cancelled part-way
concurrency:
  group: builds-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  macos:
    # macos-14 is retired: GitHub cancels its jobs at once ("configuration not supported")
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }} # empty: the commit this run is for
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Tools for the app icon
        run: brew install librsvg
      - name: Build the app and its DMG
        run: scripts/macos-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: cut-craft-macos
          path: dist/*.dmg

  linux:
    # the oldest supported Ubuntu, so the program runs on most distributions since
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }} # empty: the commit this run is for
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Libraries for windows, input and graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev \
            libxkbcommon-x11-0 libxcb-xkb1
      - name: Build
        run: cargo build --release -p cut-craft
      - name: Package the program
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="cut-craft-${version}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/cut-craft README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cut-craft-linux
          path: dist/*.tar.gz
      # the keyboard libraries the AppImage carries for systems without them, from this oldest
      # Ubuntu so they run wherever the program does (the packing below runs on a newer one)
      - name: Libraries for the AppImage
        run: |
          mkdir -p appimage-libs/licenses
          for lib in libxkbcommon.so.0 libxkbcommon-x11.so.0 libxcb-xkb.so.1; do
            cp -L "/usr/lib/x86_64-linux-gnu/$lib" appimage-libs/
          done
          for pkg in libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1; do
            cp "/usr/share/doc/$pkg/copyright" "appimage-libs/licenses/$pkg.copyright"
          done
      - uses: actions/upload-artifact@v4
        with:
          # not cut-craft-*: the release attaches only those
          name: appimage-libs
          path: appimage-libs

  linux-packages:
    # the Linux program above, packed as an AppImage and a Flatpak bundle
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }} # empty: the commit this run is for
      - uses: actions/download-artifact@v4
        with:
          name: cut-craft-linux
          path: built
      - uses: actions/download-artifact@v4
        with:
          name: appimage-libs
          path: appimage-libs
      - name: Tools for the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder librsvg2-bin
          # Ubuntu 24.04 stops the sandbox flatpak-builder runs in; let it for this build
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Pack the AppImage and the Flatpak
        run: |
          tar -C built -xzf built/*.tar.gz
          scripts/linux-packages built/cut-craft-*-linux-x86_64/cut-craft appimage-libs
      # A bare Ubuntu, the oldest supported, without the window's libraries or a screen: the
      # AppImage must print its version, and a start must say why the window can't open (the
      # library it lacks, and the package to install) rather than fail silently.
      - name: Run the AppImage on a bare system
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          bare() {
            docker run --rm -v "$PWD/dist:/dist:ro" -e APPIMAGE_EXTRACT_AND_RUN=1 "$@"
          }
          image=dist/CutCraft-${version}-x86_64.AppImage
          out=$(bare ubuntu:22.04 "/$image" --version)
          echo "$out"
          if [[ $out != "Cut Craft $version" ]]; then
            echo "::error::--version printed '$out', not 'Cut Craft $version'"
            exit 1
          fi
          # no X server: the X11 libraries are the first thing missing
          err=$(bare -e DISPLAY=:9 ubuntu:22.04 "/$image" 2>&1 >/dev/null) && status=0 || status=$?
          echo "$err"
          if [[ $status == 0 || $err != *"sudo apt install libx11-6"* ]]; then
            echo "::error::A start without the window's libraries did not explain itself"
            exit 1
          fi
          # the bundled keyboard libraries load there, given only the X client library
          bare ubuntu:22.04 bash -c "apt-get update -qq && apt-get install -y -qq libxcb1 >/dev/null \
            && cd /tmp && /$image --appimage-extract >/dev/null \
            && ! LD_LIBRARY_PATH=squashfs-root/usr/lib ldd squashfs-root/usr/lib/*.so.* 2>&1 | grep 'not found'"
      - uses: actions/upload-artifact@v4
        with:
          name: cut-craft-linux-packages
          path: |
            dist/*.AppImage
            dist/*.flatpak

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }} # empty: the commit this run is for
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p cut-craft
      - name: Package the program
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $name = "cut-craft-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/cut-craft.exe, README.md -Destination "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cut-craft-windows
          path: dist/*.zip

  # Publishes once Linux and Windows are built. The macOS DMG is attached when its build ran:
  # GitHub sometimes cancels macOS jobs before they start (no runner, minutes used up), and
  # that mustn't hold back the release for everyone else.
  release:
    if: >-
      always() && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/'))
      && needs.linux.result == 'success' && needs.linux-packages.result == 'success'
      && needs.windows.result == 'success'
    needs: [macos, linux, linux-packages, windows]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }} # empty: the commit this run is for
      - name: The tag matches the version it was built from
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ $TAG != "v$version" ]]; then
            echo "::error::Tag $TAG is on a commit whose Cargo.toml says $version; not publishing."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cut-craft-*
          merge-multiple: true
      - name: Say when the macOS DMG is missing
        if: needs.macos.result != 'success'
        run: echo "::warning::The macOS build did not finish (${{ needs.macos.result }}), so this release has no DMG yet. Run Builds again with this tag to add it."
      # FILE.minisig beside each: Help > Check for Updates installs nothing unsigned
      - name: Sign them
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          REQUIRE_SIGNING: "1"
        run: scripts/sign-release dist
      - name: Attach them all to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
                 --title "Cut Craft $TAG" --generate-notes
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
