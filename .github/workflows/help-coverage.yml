# Checks that every tool has help a beginner can use (tooltip, help page intro, help on each
# setting and option), apart from the ordinary checks. On a pull request it fails only when the
# change adds a gap not already listed in crates/app/help/coverage-baseline.txt. On main, weekly
# and by hand it keeps one GitHub issue (label help-coverage) listing every open gap, and
# closes it when none are left. See crates/app/src/app/help_coverage.rs.
name: Help coverage

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  help:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

      - name: Room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Help coverage
        env:
          HELP_COVERAGE_REPORT: ${{ github.workspace }}/help-coverage.md
        run: cargo nextest run -p cut-craft --profile help

      - name: Report on the run's page
        if: always()
        run: |
          if [ -f help-coverage.md ]; then
            { echo "## Help coverage"; echo; cat help-coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the help coverage issue up to date
        if: always() && github.event_name != 'pull_request' && hashFiles('help-coverage.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const label = 'help-coverage';
            const title = 'Help coverage: tools without enough help';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report = fs.readFileSync('help-coverage.md', 'utf8');
            const none = report.startsWith('0 help gaps');
            // an issue body holds 65536 characters; the run's page keeps the whole list
            const room = 60000;
            if (report.length > room) {
              report = report.slice(0, room).replace(/\n[^\n]*$/, '') +
                `\n\n…the list goes on: see [the run's page](${run}).`;
            }
            const body = `Written by the [Help coverage](${run}) workflow; it rewrites this ` +
              `list on every push to main and every Monday, and closes the issue when the list ` +
              `is empty. Tick nothing by hand.\n\n${report}`;
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd4c5f9',
                description: 'Tools or menu items without enough help',
              });
            }
            const open = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: 'open', per_page: 1,
            });
            const issue = open.data[0];
            if (none) {
              if (issue) {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, body, state: 'closed',
                  state_reason: 'completed',
                });
              }
            } else if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
