# Keeps the PowerWhittle timeline (the Power-Whittle org board,
# https://github.com/orgs/Power-Whittle/projects/1) up to date, so nobody adds work by hand.
# scripts/timeline does the board changes; scripts/test-timeline tests it.
#
# Pull requests from a branch in this repository:
#   opened, reopened, ready for review   In Progress; Start and Target = the day it opened
#   merged                               Done; Target = the day it merged
# Drafts wait until they're ready for review. Forks and pull requests closed without merging are
# left alone. Adding an item that's already on the board returns the existing one.
#
# Releases: after each Release tag run, a "Released vX.Y.Z" entry (Done, dated the day the tag
# was made) for each of the three newest v* tags that isn't on the board yet. "Run workflow"
# adds one named tag instead.
#
# Dates are Pacific time. PROJECT_TOKEN is a classic token of NoobyNull's with only the "project"
# scope (fine-grained tokens can't reach a board owned by a personal account). Without it the
# jobs warn and skip.
#
# pull_request_target runs this file as it is on main. Both jobs check out main, never a pull
# request's branch, so a pull request can't change what runs with the token. Keep it that way.
name: Timeline

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  workflow_run:
    workflows: [Release tag]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The v* tag to put on the timeline as released
        required: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}

jobs:
  pull-request:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' && github.event.pull_request.merged ||
       github.event.action != 'closed' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    concurrency:
      group: timeline-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/timeline
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the pull request on the board
        env:
          PR_ID: ${{ github.event.pull_request.node_id }}
          OPENED: ${{ github.event.pull_request.created_at }}
          MERGED: ${{ github.event.pull_request.merged_at }}
          ACTION: ${{ github.event.action }}
        run: |
          scripts/timeline pr "$PR_ID" "$ACTION" "$OPENED" "$MERGED"

  releases:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: timeline-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Put new releases on the board
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$TAG" ]; then
            tags=$TAG
          else
            tags=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -3)
          fi
          for tag in $tags; do
            when=$(git for-each-ref --format='%(creatordate:iso-strict)' "refs/tags/$tag")
            if [ -z "$when" ]; then echo "::error::There's no tag $tag."; exit 1; fi
            scripts/timeline release "$tag" "$when" "https://github.com/$REPO/releases/tag/$tag"
          done
