# The pre-commit gate (.githooks/pre-commit) on Linux and Windows, so both keep building, and
# on pull requests the help rule: a changed tool's help page changes too (scripts/help-touched).
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a pull request is checked out as a merge commit: its first parent is main, so the
          # help rule can see what the pull request changed
          fetch-depth: 2

      - name: Help updated for every tool changed
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        run: |
          scripts/test-help-touched
          scripts/help-touched HEAD^1

      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          # retries, and another mirror when one of Ubuntu's package servers is down
          scripts/apt-install libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

      # the test build of 180 crates once filled the runner's disk: the toolsets Cut Craft
      # never uses go first
      - name: Room on the runner
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --all-features --no-tests=pass --no-fail-fast
