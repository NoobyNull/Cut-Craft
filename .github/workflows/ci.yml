# The pre-commit gate (.githooks/pre-commit) on Linux, Windows and macOS, each on its own (one
# failing stops none of the others), so all three keep building and passing their tests, and
# on pull requests the help rule: a changed tool's help page changes too (scripts/help-touched).
#
# Tests run by area (.config/test-suites.toml). A pull request runs only the suites its changes
# reach, and the suites those affect; Format and Clippy always cover the whole workspace. Main,
# the nightly run and a run by hand run every suite, and check every test is in one of them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # the merge queue tests each pull request on top of the ones queued before it, so two that
  # pass on their own can't break main together
  merge_group:
  schedule:
    # every night, every suite on every system: 09:00 UTC is 1 or 2 AM in California
    - cron: "0 9 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  suites:
    name: Pick test suites
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pick.outputs.run }}
      command: ${{ steps.pick.outputs.command }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a pull request is checked out as a merge commit: its first parent is main
          fetch-depth: 2

      - name: Tests of the suite picker
        run: scripts/test-pick-suites

      - name: Suites this change needs
        id: pick
        run: |
          if [[ "${{ github.event_name }}" == pull_request || "${{ github.event_name }}" == merge_group ]]; then
            scripts/pick-suites --github HEAD^1
          else
            scripts/pick-suites --github --all
          fi

  check:
    # the required checks keep their names and always run: with no suite to run, the Tests step
    # says so and passes, so no pull request waits on a check that never started
    needs: suites
    # even when picking failed, so a broken picker fails the required checks instead of
    # skipping them (a skipped required check lets a pull request merge)
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is not a required check (branch protection names Ubuntu and Windows): it
        # reports, and a Mac-only failure is fixed in its own pull request
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: The suites were picked
        if: needs.suites.result != 'success'
        run: |
          echo "Picking the test suites failed: see the Pick test suites job."
          exit 1

      - uses: actions/checkout@v4
        with:
          # a pull request is checked out as a merge commit: its first parent is main, so the
          # help rule can see what the pull request changed
          fetch-depth: 2

      - name: Help updated for every tool changed
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        run: |
          scripts/test-help-touched
          scripts/help-touched HEAD^1

      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          # retries, and another mirror when one of Ubuntu's package servers is down
          scripts/apt-install libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

      # the test build of 180 crates once filled the runner's disk: the toolsets Cut Craft
      # never uses go first
      - name: Room on the runner
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        if: needs.suites.outputs.run == 'true'
        shell: bash
        env:
          COMMAND: ${{ needs.suites.outputs.command }}
        run: eval "$COMMAND"

      - name: No tests needed
        if: needs.suites.outputs.run != 'true'
        run: echo "Nothing this change touches has tests; Format and Clippy passed."

      - name: Every test is in a suite
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && runner.os == 'Linux'
        run: scripts/pick-suites --check
