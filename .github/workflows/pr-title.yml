# Each pull request's title says what kind of change it is (feat:, fix:, docs:, ...), so
# scripts/release-version can sort the next release's notes; see scripts/next-version.
# Merging doesn't change the version: that moves one step only when a release is cut.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version rule's own tests
        run: scripts/test-next-version
      - name: Release tagging's own tests
        run: scripts/test-release-commit
      - name: Release version's own tests
        run: scripts/test-release-version
      - name: The title names a kind of change
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          kind=$(scripts/next-version kind "$TITLE")
          case $kind in
            minor) echo "::notice::The next release lists this under New." ;;
            patch) echo "::notice::The next release lists this under Fixed." ;;
            none) echo "::notice::The next release's notes leave this out." ;;
          esac
