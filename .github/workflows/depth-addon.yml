# The Depth add-on's release, published on its own repository (DEPTH_REPO) so Gadgets >
# Add-ons finds it as that repository's newest release (crates/updater/src/addon.rs):
#   depth-linux-x86_64.zip, depth-windows-x86_64.zip,  addon.toml and cutcraft-depth
#   depth-macos-aarch64.zip, depth-macos-x86_64.zip     Apple Silicon and Intel Macs
#   depth_anything_v2_vits.safetensors                 the weights, once for all
#   depth_anything_v2_vitl.safetensors                 High detail (optional, non-commercial)
# Each file signed with Cut Craft's release key (FILE.minisig beside it), so Add-ons
# installs it as official, with no "not official" warning (Matthew, 2026-11-18).
# Started by "Run workflow" or a depth-v* tag; the version is addon.toml's. Needs
# ADDON_RELEASE_TOKEN, a token that may write releases on DEPTH_REPO (the workflow's own
# token can only write to this repository), and the release key the app's releases use:
# MINISIGN_SECRET_KEY and MINISIGN_PASSWORD.
name: Depth add-on

on:
  push:
    tags: ['depth-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DEPTH_REPO: NoobyNull/CutCraft-Depth
  # Depth Anything V2 Small (Apache 2.0); Base and Large are non-commercial, never these
  WEIGHTS_URL: https://huggingface.co/depth-anything/Depth-Anything-V2-Small/resolve/main/depth_anything_v2_vits.pth
  # Large (CC-BY-NC 4.0, non-commercial): only an optional download, with that said in the app
  LARGE_WEIGHTS_URL: https://huggingface.co/depth-anything/Depth-Anything-V2-Large/resolve/main/depth_anything_v2_vitl.pth

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the program runnable on older glibc distributions
          - os: ubuntu-22.04
            name: linux-x86_64
            exe: cutcraft-depth
          - os: windows-latest
            name: windows-x86_64
            exe: cutcraft-depth.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p cut-craft-depth
      - name: Zip
        shell: bash
        run: |
          mkdir -p out pack
          cp crates/depth-addon/addon.toml crates/depth-addon/README.md LICENSE "target/release/${{ matrix.exe }}" pack/
          if [[ "$RUNNER_OS" == Windows ]]; then
            (cd pack && 7z a -tzip "../out/depth-${{ matrix.name }}.zip" .)
          else
            (cd pack && zip -r "../out/depth-${{ matrix.name }}.zip" .)
          fi
      - name: Weights
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o vits.pth "$WEIGHTS_URL"
          target/release/cutcraft-depth convert vits.pth out/depth_anything_v2_vits.safetensors
          curl -fsSL --retry 3 -o vitl.pth "$LARGE_WEIGHTS_URL"
          target/release/cutcraft-depth convert vitl.pth out/depth_anything_v2_vitl.safetensors
          rm vits.pth vitl.pth
      - uses: actions/upload-artifact@v4
        with:
          name: depth-${{ matrix.name }}
          path: out/*

  # Macs, Apple Silicon and Intel (both built on one Apple Silicon runner), on their own:
  # GitHub sometimes cancels macOS jobs before they start (no runner, minutes used up), and
  # that mustn't hold back Linux and Windows. Run the workflow again later and publish adds
  # the Mac zips to the same release. (macos-14 is retired: see builds-macos.yml)
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build and zip
        run: |
          mkdir -p out
          for arch in aarch64 x86_64; do
            cargo build --release -p cut-craft-depth --target "$arch-apple-darwin"
            rm -rf pack && mkdir pack
            cp crates/depth-addon/addon.toml crates/depth-addon/README.md LICENSE \
              "target/$arch-apple-darwin/release/cutcraft-depth" pack/
            (cd pack && zip -r "../out/depth-macos-$arch.zip" .)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: depth-macos
          path: out/*

  publish:
    # once Linux (which also makes the weights) and Windows are built; the Mac zips if they were
    if: always() && needs.build.result == 'success'
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # A second run of a version re-uploads only what it built. Files already on the release
      # that this run didn't build (the Mac zips, when the Mac build failed this time) are
      # fetched so they get signed too, but only those with no signature yet.
      - name: Fetch unsigned files already on the release
        env:
          GH_TOKEN: ${{ secrets.ADDON_RELEASE_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/depth-addon/addon.toml)
          if [[ -n "$GH_TOKEN" ]] && gh release view "v$version" --repo "$DEPTH_REPO" >/dev/null 2>&1; then
            gh release view "v$version" --repo "$DEPTH_REPO" --json assets --jq '.assets[].name' > names
            while read -r name; do
              [[ $name == *.minisig || -e "out/$name" ]] && continue
              grep -qxF "$name.minisig" names && continue
              echo "fetching $name to sign it"
              gh release download "v$version" --repo "$DEPTH_REPO" --pattern "$name" --dir out
            done < names
            rm names
          fi
      # every file, the weights too: Cut Craft counts an add-on official only when all are
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          REQUIRE_SIGNING: '1'
        run: scripts/sign-release out
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.ADDON_RELEASE_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::ADDON_RELEASE_TOKEN is not set: add a token that may write releases on $DEPTH_REPO"
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/depth-addon/addon.toml)
          if gh release view "v$version" --repo "$DEPTH_REPO" >/dev/null 2>&1; then
            # a second run of the same version adds what was missing (a Mac zip, say)
            gh release upload "v$version" out/* --repo "$DEPTH_REPO" --clobber
          else
            gh release create "v$version" out/* --repo "$DEPTH_REPO" \
              --title "Depth add-on $version" \
              --notes "Estimates a photo's depth for Relief from Photo. Install it from Cut Craft: Gadgets > Add-ons."
          fi
      - name: Say when the Mac zip is missing
        if: needs.build-macos.result != 'success'
        run: echo "::warning::The Mac build did not finish (${{ needs.build-macos.result }}), so this release has no Mac zips yet. Run Depth add-on again to add it."
