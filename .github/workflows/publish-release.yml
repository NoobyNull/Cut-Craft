# One computer's part of a release, called by each of the three Builds workflows (Linux,
# Windows, macOS) once its own builds pass: checks the tag is the version built, signs the
# files (FILE.minisig beside each; Help > Check for Updates installs nothing unsigned), and
# adds them to the release with scripts/publish-release. Whichever computer finishes first
# publishes the release; the others add their files to it as they finish.
#
# Each release is mirrored to Power-Whittle/PowerWhittle too, where Cut Craft is moving (the
# updater reads both; crates/updater HOMES): the tag and main are pushed there, and the same
# signed files go on the same release with the same script. It pushes with the secret
# MIRROR_TOKEN, or else ADDON_RELEASE_TOKEN: a token of the owner's that may push code,
# workflows and releases there (a classic token with the repo and workflow scopes does).
# Org secrets do not reach this repository, so the secret is set here. Without one, or
# when the mirror fails, the release here goes ahead.
name: Publish release

on:
  workflow_call:
    inputs:
      tag:
        description: The v* tag being released
        required: true
        type: string
      artifacts:
        description: The build artifacts to attach (a download-artifact pattern)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # no concurrency group: a third waiting publisher would cancel the second one queued.
    # Two finishing at once is safe: scripts/publish-release lets one make the release and the
    # other add to it.
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # the scripts from the commit this run is for (main's, when Release tag starts it), so
      # an older tag can be published again with today's fixes
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: tagged
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      - name: The tag matches the version it was built from
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' tagged/Cargo.toml | head -1)
          if [[ $TAG != "v$version" ]]; then
            echo "::error::Tag $TAG is on a commit whose Cargo.toml says $version; not publishing."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ${{ inputs.artifacts }}
          merge-multiple: true
      - name: Sign them
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          REQUIRE_SIGNING: "1"
        run: scripts/sign-release dist
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release "$TAG" dist
      - name: Mirror them to Power-Whittle
        continue-on-error: true
        env:
          MIRROR: Power-Whittle/PowerWhittle
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN || secrets.ADDON_RELEASE_TOKEN }}
        run: |
          if [[ -z $MIRROR_TOKEN ]]; then
            echo "::notice::Neither MIRROR_TOKEN nor ADDON_RELEASE_TOKEN is set, so $TAG is not mirrored to $MIRROR"
            exit 0
          fi
          git fetch -q --unshallow origin || git fetch -q origin
          git fetch -q origin "+refs/heads/main:refs/remotes/origin/main" "refs/tags/$TAG:refs/tags/$TAG"
          git remote add mirror "https://x-access-token:$MIRROR_TOKEN@github.com/$MIRROR.git"
          git -c http.https://github.com/.extraheader= push mirror "refs/tags/$TAG"
          # main as it is here; a mirror whose main went its own way keeps it, with a warning
          git -c http.https://github.com/.extraheader= push mirror "refs/remotes/origin/main:refs/heads/main" \
            || echo "::warning::$MIRROR's main was not updated"
          GH_TOKEN=$MIRROR_TOKEN GITHUB_REPOSITORY=$MIRROR scripts/publish-release "$TAG" dist
