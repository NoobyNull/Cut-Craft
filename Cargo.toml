[workspace]
resolver = "3"
members = ["crates/app", "crates/core", "crates/post", "crates/commands/*", "crates/formats/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aspire-core = { path = "crates/core" }
eframe = { version = "0.27", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
dxf = "0.6"
egui_extras = { version = "0.27", default-features = false, features = ["file", "svg"] }
env_logger = "0.10"
glam = { version = "0.30", features = ["serde"] }
i_overlay = "9.1"
log = "0.4"
rfd = "0.17"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
usvg = "0.37"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
