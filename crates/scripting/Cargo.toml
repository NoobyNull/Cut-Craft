[package]
publish.workspace = true
name = "cut-craft-scripting"
description = "Lua gadgets: a sandboxed Lua 5.4 that drives the commands, one undo step per run, and add-on gadgets that fetch from listed hosts"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
cut-craft-core.workspace = true
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serde"] }
serde_json.workspace = true
# outside gadgets: web requests to the hosts an add-on lists
ureq = { version = "3", features = ["platform-verifier"] }
url = "2"

[dev-dependencies]
cut-craft-core = { workspace = true, features = ["testing"] }
cmd-draw-circle = { path = "../commands/draw-circle" }

[lints]
workspace = true
