[package]
name = "aspire-clone"
description = "Desktop UI: panels, menus, forms and tools over the command registry"
version.workspace = true
edition.workspace = true

[dependencies]
aspire-core.workspace = true
aspire-post = { path = "../post" }
eframe.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
log.workspace = true
rfd.workspace = true
schemars.workspace = true
serde_json.workspace = true
# File formats: one line per crate in crates/formats, registered in src/commands.rs
fmt-export-dxf = { path = "../formats/export-dxf" }
fmt-export-gcode = { path = "../formats/export-gcode" }
fmt-export-as-stl = { path = "../formats/export-as-stl" }
fmt-export-svg = { path = "../formats/export-svg" }
fmt-import-dxf = { path = "../formats/import-dxf" }
fmt-import-svg = { path = "../formats/import-svg" }
# Commands: one line per crate in crates/commands, registered in src/commands.rs
cmd-3d-roughing-toolpath = { path = "../commands/3d-roughing-toolpath" }
cmd-3d-finishing-toolpath = { path = "../commands/3d-finishing-toolpath" }
cmd-vcarve-engrave-toolpath = { path = "../commands/vcarve-engrave-toolpath" }
cmd-create-shape = { path = "../commands/create-shape" }
cmd-set-current-layer = { path = "../commands/set-current-layer" }
cmd-layer-properties = { path = "../commands/layer-properties" }
cmd-select-layer-vectors = { path = "../commands/select-layer-vectors" }
cmd-move-to-layer = { path = "../commands/move-to-layer" }
cmd-delete-layer = { path = "../commands/delete-layer" }
cmd-add-layer = { path = "../commands/add-layer" }
cmd-drilling-toolpath = { path = "../commands/drilling-toolpath" }
cmd-pocket-toolpath = { path = "../commands/pocket-toolpath" }
cmd-profile-toolpath = { path = "../commands/profile-toolpath" }
cmd-join-vectors = { path = "../commands/join-vectors" }
cmd-offset-vectors = { path = "../commands/offset-vectors" }
cmd-overlap-intersect = { path = "../commands/overlap-intersect" }
cmd-subtract-vectors = { path = "../commands/subtract-vectors" }
cmd-weld-vectors = { path = "../commands/weld-vectors" }
cmd-job-setup = { path = "../commands/job-setup" }
cmd-align-bottom = { path = "../commands/align-bottom" }
cmd-align-left = { path = "../commands/align-left" }
cmd-align-right = { path = "../commands/align-right" }
cmd-align-top = { path = "../commands/align-top" }
cmd-center = { path = "../commands/center" }
cmd-center-horizontally = { path = "../commands/center-horizontally" }
cmd-center-horizontally-in-material = { path = "../commands/center-horizontally-in-material" }
cmd-center-in-material = { path = "../commands/center-in-material" }
cmd-center-vertically = { path = "../commands/center-vertically" }
cmd-center-vertically-in-material = { path = "../commands/center-vertically-in-material" }
cmd-delete = { path = "../commands/delete" }
cmd-draw-arc = { path = "../commands/draw-arc" }
cmd-draw-circle = { path = "../commands/draw-circle" }
cmd-draw-ellipse = { path = "../commands/draw-ellipse" }
cmd-draw-polygon = { path = "../commands/draw-polygon" }
cmd-draw-polyline = { path = "../commands/draw-polyline" }
cmd-draw-rectangle = { path = "../commands/draw-rectangle" }
cmd-draw-star = { path = "../commands/draw-star" }
cmd-mirror = { path = "../commands/mirror" }
cmd-move = { path = "../commands/move" }
cmd-rotate = { path = "../commands/rotate" }
cmd-select-all-vectors = { path = "../commands/select-all-vectors" }
cmd-set-size = { path = "../commands/set-size" }
cmd-unselect-all = { path = "../commands/unselect-all" }

[dev-dependencies]
aspire-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
