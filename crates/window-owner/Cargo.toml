[package]
name = "cut-craft-window-owner"
description = "Keeps Cut Craft's dialog windows above the main window: each is made the main window's own"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
log = "0.4"
raw-window-handle = "0.6"

# talks to the X server directly (pure Rust, no Xlib): Linux and the BSDs, X11 and XWayland
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# The workspace forbids unsafe code; this crate alone needs it, for the two system calls that
# make a window another's own on Windows and for handing a window to the file dialogs. Each
# use is marked and explained; everything else matches the workspace's lints.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
float_cmp = "allow"
