[package]
publish.workspace = true
name = "cut-craft-backup"
description = "Help > Back Up Settings: the user's settings, machines, bits and own files in one .ccbackup file, made by hand or automatically before big changes"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# each file's checksum in the manifest, and spotting a backup that would only repeat one kept
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
