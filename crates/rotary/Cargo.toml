[package]
name = "cut-craft-rotary"
description = "Rotary work in true 3D: the material and the model as solids on the turning axis, the bit dropped onto them at any turn of A, and a simulator that cuts the material with the very moves a file makes"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
cut-craft-core.workspace = true

[lints]
workspace = true

[dev-dependencies]
cut-craft-core = { workspace = true, features = ["testing"] }
cut-craft-post = { path = "../post" }
cmd-rotary-machining-toolpath = { path = "../commands/rotary-machining-toolpath" }
chrono.workspace = true
