# The Depth add-on's manifest, in the shared add-on layout: a zip of this file, the
# program (cutcraft-depth, .exe on Windows) and the weights, unpacked per user into
# <add-ons folder>/depth/.
id = "depth"
name = "Depth (Relief from Photo)"
kind = "tool"
