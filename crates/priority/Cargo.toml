[package]
publish.workspace = true
name = "cut-craft-priority"
description = "Lowers a calculation thread's priority, so other programs come first, and reads the processor time Cut Craft has used"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# The workspace forbids unsafe code; this crate alone needs it, for the system calls that lower
# a thread's priority and read the processor time used. Each use is marked and explained;
# everything else matches the workspace's lints.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
float_cmp = "allow"
