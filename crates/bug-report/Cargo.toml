[package]
name = "cut-craft-bug-report"
description = "Right-click > Report a Bug Here: a GitHub issue with where in the code it was, the state and a screenshot"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
eframe.workspace = true
image.workspace = true
log = "0.4"
serde_json.workspace = true
# crash logs to the crash-report service over HTTPS, as the updater reaches GitHub
ureq = { version = "3", features = ["platform-verifier"] }

[lints]
workspace = true
