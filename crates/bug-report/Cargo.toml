[package]
publish.workspace = true
name = "cut-craft-bug-report"
description = "Right-click > Report a Bug Here: a GitHub issue with where in the code it was, the state and a screenshot"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
# keeps each dialog window above the main window
cut-craft-window-owner.workspace = true
# the names a screen reader reads for a number box and its arrows
cut-craft-i18n.workspace = true
eframe.workspace = true
image.workspace = true
log = "0.4"
serde_json.workspace = true
# the proof of work the crash-report service asks of each report
sha2 = "0.10"
# crash logs to the crash-report service over HTTPS, as the updater reaches GitHub
ureq = { version = "3", features = ["platform-verifier"] }

[lints]
workspace = true
